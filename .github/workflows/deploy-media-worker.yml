name: Deploy Media Worker to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - cloudflare/media-proxy-worker/**
      - .github/workflows/deploy-media-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-media-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloudflare/media-proxy-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Worker syntax
        run: node --check src/index.js

      - name: Deploy Worker
        run: npx --yes wrangler deploy --config wrangler.ci.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
